name: Fabriquer l'APK MOUBARAK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Installer Capacitor
        run: npm install
      - name: Créer le projet Android
        run: npx cap add android
      - name: Ajouter le code des dossiers de galerie
        run: |
          D=android/app/src/main/java/barakah/khelcom/moubarak
          mkdir -p $D
          cp native/MoubarakMediaPlugin.java $D/
          cp native/MainActivity.java $D/
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Mettre l'icône MOUBARAK
        run: |
          curl -fsSL https://khm.khelcom-moubarak.workers.dev/icon-512.png -o icon.png
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import glob, os
          im = Image.open("icon.png").convert("RGBA")
          for d, s in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              p = "android/app/src/main/res/mipmap-" + d
              for n in ("ic_launcher.png", "ic_launcher_round.png"):
                  im.resize((s, s), Image.LANCZOS).save(os.path.join(p, n))
          for f in glob.glob("android/app/src/main/res/mipmap-anydpi-v26/*.xml"):
              os.remove(f)
          PY
      - name: Synchroniser
        run: npx cap sync android
      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: moubarak-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
