name: Fabriquer l'APK MOUBARAK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Installer Capacitor
        run: npm install
      - name: Créer le projet Android
        run: npx cap add android
      - name: Ajouter le code des dossiers de galerie
        run: |
          D=android/app/src/main/java/barakah/khelcom/moubarak
          mkdir -p $D
          cp native/MoubarakMediaPlugin.java $D/
          cp native/MainActivity.java $D/
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Synchroniser
        run: npx cap sync android
      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: moubarak-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
